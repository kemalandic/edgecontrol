name: EdgeControl
options:
  bundleIdPrefix: ai.pakslab
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.3"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Single source of truth. Both Info.plists read these through
    # $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION), so the app and its
    # widget extension can no longer drift apart.
    MARKETING_VERSION: "2.2.0"
    CURRENT_PROJECT_VERSION: "4"

targets:
  EdgeControl:
    type: application
    platform: macOS
    sources:
      - path: Sources/EdgeControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.pakslab.edgecontrol
        PRODUCT_NAME: EdgeControl
        INFOPLIST_FILE: Sources/EdgeControl/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/EdgeControl/EdgeControl.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CNRZ47Y629 # Contributors: replace with your own Apple Developer Team ID
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: EdgeControlWidgets

  EdgeControlWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/EdgeControlWidgets
      - path: Sources/EdgeControl/Models/WidgetData.swift
        createIntermediateGroups: false
      # WidgetData carries CIRunState, so the extension needs the enum too.
      - path: Sources/EdgeControl/Services/CI/CIRunState.swift
        createIntermediateGroups: false
      # WidgetData.write() logs through AppLog; Foundation + os only, so it
      # is safe inside the sandboxed extension.
      - path: Sources/EdgeControl/Services/AppLog.swift
        createIntermediateGroups: false
    info:
      path: Sources/EdgeControlWidgets/Info.plist
      properties:
        CFBundleDisplayName: EdgeControl Widgets
        # xcodegen regenerates this plist, so the version keys have to
        # live here rather than in the file itself.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.pakslab.edgecontrol.widgets
        PRODUCT_NAME: EdgeControlWidgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CNRZ47Y629
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_ENTITLEMENTS: Sources/EdgeControlWidgets/EdgeControlWidgets.entitlements
        SKIP_INSTALL: true
        ENABLE_HARDENED_RUNTIME: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    dependencies: []

  EdgeControlTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/EdgeControlTests
        excludes:
          - "CI/Fixtures/**"
      # Recorded API responses, copied into the test bundle so providers can be
      # exercised without network access.
      - path: Tests/EdgeControlTests/CI/Fixtures
        buildPhase: resources
    dependencies:
      - target: EdgeControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.pakslab.edgecontrol.tests
        GENERATE_INFOPLIST_FILE: true
        # Must match the host app's team, otherwise the host refuses to dlopen
        # the test bundle: "different Team IDs".
        DEVELOPMENT_TEAM: CNRZ47Y629
        CODE_SIGN_STYLE: Automatic
