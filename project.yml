name: EdgeControl
options:
  bundleIdPrefix: ai.pakslab
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.3"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Single source of truth. Both Info.plists read these through
    # $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION), so the app and its
    # widget extension can no longer drift apart.
    MARKETING_VERSION: "2.4.0"
    CURRENT_PROJECT_VERSION: "7"

targets:
  EdgeControl:
    type: application
    platform: macOS
    sources:
      - path: Sources/EdgeControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.pakslab.edgecontrol
        PRODUCT_NAME: EdgeControl
        INFOPLIST_FILE: Sources/EdgeControl/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/EdgeControl/EdgeControl.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CNRZ47Y629 # Contributors: replace with your own Apple Developer Team ID
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: EdgeControlWidgets
      # Runs the Now Playing AppleScript in place of osascript — see
      # Sources/EdgeControlScriptRunner/main.swift for why.
      - target: EdgeControlScriptRunner
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers

  EdgeControlWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/EdgeControlWidgets
      - path: Sources/EdgeControl/Models/WidgetData.swift
        createIntermediateGroups: false
      # WidgetData carries CIRunState, so the extension needs the enum too.
      - path: Sources/EdgeControl/Services/CI/CIRunState.swift
        createIntermediateGroups: false
      # Same reason: the snapshot carries the unit system so the desktop widget
      # renders the same scale as the dashboard.
      - path: Sources/EdgeControl/Models/UnitSystem.swift
        createIntermediateGroups: false
      # WidgetData.write() logs through AppLog; Foundation + os only, so it
      # is safe inside the sandboxed extension.
      - path: Sources/EdgeControl/Services/AppLog.swift
        createIntermediateGroups: false
    info:
      path: Sources/EdgeControlWidgets/Info.plist
      properties:
        CFBundleDisplayName: EdgeControl Widgets
        # xcodegen regenerates this plist, so the version keys have to
        # live here rather than in the file itself.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.pakslab.edgecontrol.widgets
        PRODUCT_NAME: EdgeControlWidgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CNRZ47Y629
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_ENTITLEMENTS: Sources/EdgeControlWidgets/EdgeControlWidgets.entitlements
        SKIP_INSTALL: true
        ENABLE_HARDENED_RUNTIME: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    dependencies: []

  EdgeControlScriptRunner:
    type: application
    platform: macOS
    sources:
      - path: Sources/EdgeControlScriptRunner
    info:
      path: Sources/EdgeControlScriptRunner/Info.plist
      properties:
        CFBundleDisplayName: EdgeControl Script Runner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Never a Dock icon, never a menu bar — the reason this helper exists.
        LSBackgroundOnly: true
        # The helper is the process that sends the Apple events, so it needs the
        # key as well as the entitlement. The permission itself is still granted
        # to EdgeControl, which launches it.
        NSAppleEventsUsageDescription: EdgeControl reads what is playing in your browser and music apps and controls playback from the dashboard.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.pakslab.edgecontrol.scriptrunner
        PRODUCT_NAME: EdgeControlScriptRunner
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CNRZ47Y629
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_ENTITLEMENTS: Sources/EdgeControlScriptRunner/EdgeControlScriptRunner.entitlements
        # Embedded in EdgeControl.app; archiving it on its own would put a second
        # app in the archive's Products/Applications.
        SKIP_INSTALL: true
        ENABLE_HARDENED_RUNTIME: true
    dependencies: []

  EdgeControlTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/EdgeControlTests
        excludes:
          - "Fixtures/**"
      # Recorded API responses, copied into the test bundle so providers can be
      # exercised without network access. Copied flat — filenames must be unique
      # across every subdirectory here.
      - path: Tests/EdgeControlTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: EdgeControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.pakslab.edgecontrol.tests
        GENERATE_INFOPLIST_FILE: true
        # Must match the host app's team, otherwise the host refuses to dlopen
        # the test bundle: "different Team IDs".
        DEVELOPMENT_TEAM: CNRZ47Y629
        CODE_SIGN_STYLE: Automatic
        # Swift Testing lives beside XCTest in the platform's Developer
        # frameworks. Xcode links it automatically for targets it creates
        # itself; an xcodegen-generated bundle needs it stated.
        ENABLE_TESTING_SEARCH_PATHS: YES

schemes:
  EdgeControl:
    build:
      targets:
        EdgeControl: all
    test:
      gatherCoverageData: true
      coverageTargets:
        - EdgeControl
      targets:
        - EdgeControlTests
    run:
      config: Debug
